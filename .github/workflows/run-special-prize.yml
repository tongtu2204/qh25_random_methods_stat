name: Run special-prize experiment

on:
  push:
    branches: [main]
    paths:
      - 'experiments/p2_models/06_special_prize_models.py'
      - 'experiments/p3_strategies/03_special_prize_backtest.py'
      - '.github/workflows/run-special-prize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run special-prize models
        run: python experiments/p2_models/06_special_prize_models.py

      - name: Run special-prize backtest
        run: python experiments/p3_strategies/03_special_prize_backtest.py

      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: special-prize-results
          path: |
            artifacts/p2_models/special_prize/
            artifacts/p3_strategies/special_prize/

      - name: Commit experiment outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/p2_models/special_prize artifacts/p3_strategies/special_prize
          if git diff --cached --quiet; then
            echo 'Experiment outputs are unchanged.'
          else
            git commit -m 'Add special-prize experiment results'
            git push
          fi

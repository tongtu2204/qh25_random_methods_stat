name: Run special-prize train-2020 test-2021-2025 experiment

on:
  push:
    branches: [main]
    paths:
      - 'experiments/p3_strategies/05_special_prize_train2020_test2021_2025.py'
      - '.github/workflows/run-special-prize-train2020-test2021-2025.yml'
      - 'experiments/p2_models/06_special_prize_models.py'
      - 'experiments/p3_strategies/03_special_prize_backtest.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run train-2020 test-2021-2025 experiment
        run: python experiments/p3_strategies/05_special_prize_train2020_test2021_2025.py

      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: special-prize-train2020-test2021-2025-results
          path: artifacts/p3_strategies/special_prize_train2020_test2021_2025/
          if-no-files-found: error

      - name: Commit experiment outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/p3_strategies/special_prize_train2020_test2021_2025
          if git diff --cached --quiet; then
            echo 'Experiment outputs are unchanged.'
          else
            git commit -m 'Add train-2020 test-2021-2025 special-prize results'
            git push
          fi
